name: Build FreeCrawl PortableApps ZIP and PAF Installer

on:
  workflow_dispatch:
    inputs:
      publisher_ref:
        description: 'Tag or branch with VERIFIED PAF support in vhick/portable-release-publisher (use a new immutable tag when available)'
        required: true
        type: string
        default: 'main'

permissions:
  contents: write

concurrency:
  group: freecrawl-portableapps-release
  cancel-in-progress: false

jobs:
  package:
    name: Build, install-test, and publish ZIP + official PAF
    runs-on: windows-2022
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      BUILDER_REV: '2'
      PLAYWRIGHT_SKIP_BROWSER_INSTALL: '1'
      BUNDLE_PLAYWRIGHT: '0'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out only the independent builder
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve latest stable upstream release
        id: source
        shell: pwsh
        run: python scripts/resolve_upstream.py

      - name: Skip previously published exact release asset set
        id: existing
        shell: pwsh
        run: |
          ./scripts/check_existing.ps1 -Tag '${{ steps.source.outputs.release_tag }}' -PackageName '${{ steps.source.outputs.package_name }}' -PafName '${{ steps.source.outputs.paf_name }}'

      # Checked-out action preserves the shared publisher implementation. No competing uploader.
      # Set publisher_ref to your NEW tag after pushing your PAF-capable publisher code.
      - name: Check out the shared publisher at selected ref
        if: steps.existing.outputs.skip_build != 'true'
        uses: actions/checkout@v4
        with:
          repository: vhick/portable-release-publisher
          ref: ${{ inputs.publisher_ref }}
          path: .publisher
          persist-credentials: false

      - name: Check shared publisher PAF capability before consuming build minutes
        if: steps.existing.outputs.skip_build != 'true'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: PyYAML==6.0.2
          if ($LASTEXITCODE -ne 0) { throw 'Cannot install PyYAML' }
          python scripts/check_publisher.py
          if ($LASTEXITCODE -ne 0) { throw 'Selected publisher is not PAF-capable' }
          git -C .publisher rev-parse HEAD

      - name: Retrieve exact stable upstream tag without a fork
        if: steps.existing.outputs.skip_build != 'true'
        shell: pwsh
        run: |
          git clone --depth 1 --branch '${{ steps.source.outputs.upstream_tag }}' https://github.com/kemalai/FreeCrawl-SEO-Tool.git upstream
          if ($LASTEXITCODE -ne 0) { throw 'Failed to clone stable tag' }
          $commit=(git -C upstream rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $commit -notmatch '^[0-9a-f]{40}$') { throw 'Cannot resolve source commit' }
          "UPSTREAM_SHA=$commit" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Upstream commit $commit"

      - name: Install Node.js 22
        if: steps.existing.outputs.skip_build != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply guarded Electron portable profile patch
        if: steps.existing.outputs.skip_build != 'true'
        shell: pwsh
        run: python scripts/patch_source.py upstream

      - name: Install locked source dependencies
        if: steps.existing.outputs.skip_build != 'true'
        working-directory: upstream
        shell: pwsh
        run: npm ci --no-audit --no-fund

      - name: Compile upstream packages and Electron
        if: steps.existing.outputs.skip_build != 'true'
        working-directory: upstream
        shell: pwsh
        run: npm run build

      - name: Produce unpacked Windows application
        if: steps.existing.outputs.skip_build != 'true'
        working-directory: upstream/apps/desktop
        shell: pwsh
        run: npx --no-install electron-builder --win --x64 --dir --publish never

      - name: Build genuine native x64 PortableApps launcher
        if: steps.existing.outputs.skip_build != 'true'
        shell: pwsh
        run: |
          $icon=(Resolve-Path 'upstream/apps/desktop/resources/icon.ico').Path.Replace('\','/')
          cmake -S launcher -B build/launcher -G 'Visual Studio 17 2022' -A x64 "-DFREECRAWL_ICON=$icon"
          if ($LASTEXITCODE -ne 0) { throw 'CMake configuration failed' }
          cmake --build build/launcher --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Launcher compilation failed' }

      - name: Create PortableApps directory and ZIP
        if: steps.existing.outputs.skip_build != 'true'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: Pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { throw 'Pillow installation failed' }
          python scripts/package.py --version '${{ steps.source.outputs.upstream_version }}' --commit "$env:UPSTREAM_SHA" --revision $env:BUILDER_REV
          if ($LASTEXITCODE -ne 0) { throw 'ZIP packaging failed' }

      - name: Build authentic PAF with checksum-verified PortableApps.com Installer
        if: steps.existing.outputs.skip_build != 'true'
        shell: pwsh
        run: ./scripts/build_installer.ps1 -Version '${{ steps.source.outputs.upstream_version }}' -Revision $env:BUILDER_REV

      - name: Validate PortableApps ZIP and genuine Windows executables
        if: steps.existing.outputs.skip_build != 'true'
        shell: pwsh
        run: python scripts/validate.py 'dist/${{ steps.source.outputs.package_name }}' --version '${{ steps.source.outputs.upstream_version }}'

      - name: Windows launch and folder relocation smoke test
        if: steps.existing.outputs.skip_build != 'true'
        shell: pwsh
        run: ./scripts/smoke.ps1 -ZipPath 'dist/${{ steps.source.outputs.package_name }}'

      - name: Install and upgrade official PAF in throwaway folder; preserve Data
        if: steps.existing.outputs.skip_build != 'true'
        shell: pwsh
        run: ./scripts/verify_installer.ps1 -Installer 'dist/${{ steps.source.outputs.paf_name }}' -Version '${{ steps.source.outputs.upstream_version }}'

      - name: Publisher dry-run validates BOTH real packages (no upload)
        if: steps.existing.outputs.skip_build != 'true'
        uses: ./.publisher
        with:
          files: |
            dist/${{ steps.source.outputs.package_name }}
            dist/${{ steps.source.outputs.paf_name }}
          tag: ${{ steps.source.outputs.release_tag }}
          tag-prefix: portable-
          release-title: FreeCrawl ${{ steps.source.outputs.upstream_version }} PortableApps ZIP + PAF (r2)
          keep-releases: '3'
          prune: 'false'
          dry-run: 'true'

      - name: Publish BOTH through the same verified shared publisher
        if: steps.existing.outputs.skip_build != 'true'
        uses: ./.publisher
        with:
          files: |
            dist/${{ steps.source.outputs.package_name }}
            dist/${{ steps.source.outputs.paf_name }}
          tag: ${{ steps.source.outputs.release_tag }}
          tag-prefix: portable-
          release-title: FreeCrawl ${{ steps.source.outputs.upstream_version }} PortableApps ZIP + PAF (r2)
          keep-releases: '3'
          prune: 'false'
          dry-run: 'false'
