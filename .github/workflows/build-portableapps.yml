name: Build FreeCrawl SEO Tool PortableApps
"on":
  workflow_dispatch:
    inputs:
      version:
        description: "Latest stable published upstream release, or explicit stable version (for example 1.1.5)"
        required: true
        default: latest
        type: string
      package_revision:
        description: "Change after modifying builder or packaging (for example b1r2)"
        required: true
        default: b1r1
        type: string
      publish:
        description: "Publish ZIP and community PAF installer to this builder repository Releases"
        required: true
        default: true
        type: boolean

permissions:
  contents: write  # Publisher requires release write; only trusted manual dispatch and pinned source tag.

concurrency:
  group: freecrawl-portableapps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-package-publish:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PLAYWRIGHT_SKIP_BROWSER_INSTALL: '1'
    steps:
      - name: Checkout standalone builder repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test pure-Python packaging and source-adapter safety checks
        run: python -m unittest discover -s tests -v

      - name: Verify exactly pinned shared-action interfaces
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/verify_actions.py

      - name: Resolve and verify published stable upstream version and immutable commit
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RESOLVE_VERSION: ${{ inputs.version }}
          RESOLVE_REVISION: ${{ inputs.package_revision }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: |
          python scripts/builder.py resolve --version "$env:RESOLVE_VERSION" --package-revision "$env:RESOLVE_REVISION" --publish "$env:PUBLISH_REQUESTED"

      - name: Fetch pinned upstream source tag only
        if: steps.resolve.outputs.skip != 'true'
        run: python scripts/builder.py fetch

      - name: Patch app-controlled data paths before Electron startup
        if: steps.resolve.outputs.skip != 'true'
        run: python scripts/builder.py patch

      - name: Prepare Node.js 22
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: npm lockfile install (honour verified upstream browser-download skip switch)
        if: steps.resolve.outputs.skip != 'true'
        working-directory: work/upstream
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }

      - name: Build real FreeCrawl from source
        if: steps.resolve.outputs.skip != 'true'
        working-directory: work/upstream
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'upstream build failed' }

      - name: Confirm portable paths survived transpilation into actual compiled JS
        if: steps.resolve.outputs.skip != 'true'
        run: python scripts/builder.py verify-compiled-adapter

      - name: Prepare upstream Playwright browser resource directory (on-demand browser mode)
        if: steps.resolve.outputs.skip != 'true'
        working-directory: work/upstream/apps/desktop
        run: |
          npm run prepare:playwright-bundle
          if ($LASTEXITCODE -ne 0) { throw 'Upstream Playwright resource preparation failed' }

      - name: Build unpacked Electron Windows app (not upstream setup or portable wrapper)
        if: steps.resolve.outputs.skip != 'true'
        working-directory: work/upstream/apps/desktop
        run: |
          npm exec -- electron-builder --win --x64 --dir --publish never
          if ($LASTEXITCODE -ne 0) { throw 'electron-builder win-unpacked failed' }
          if (-not (Test-Path -LiteralPath 'release/win-unpacked/FreeCrawl SEO Tool.exe')) { throw 'Actual desktop PE not built' }

      - name: Derive launcher and AppInfo icons from upstream ICO
        if: steps.resolve.outputs.skip != 'true'
        run: '& ./scripts/make_icons.ps1'

      - name: Compile genuine Windows x64 launcher from C++ source
        if: steps.resolve.outputs.skip != 'true'
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'vswhere not installed on Windows runner' }
          # Prefer VS 2022 for predictable hosted-runner support, fall back to VS 2026.
          $generators = (& cmake --help | Out-String)
          $generator = $null
          foreach ($choice in @(@{ range='[17.0,18.0)'; name='Visual Studio 17 2022' }, @{ range='[18.0,19.0)'; name='Visual Studio 18 2026' })) {
            $found = (& $vswhere -latest -products '*' -version $choice.range -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
            if ($found -and $generators.Contains($choice.name)) { $generator = $choice.name; break }
          }
          if (-not $generator) { throw 'No installed Visual Studio C++ toolchain matches a supported CMake generator' }
          Write-Host "Compiling genuine launcher with $generator"
          cmake -S launcher -B work/launcher-build -G $generator -A x64
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
          cmake --build work/launcher-build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Launcher MSVC compilation failed' }

      - name: Stage complete PortableApps folder; create and CRC-validate independent ZIP
        if: steps.resolve.outputs.skip != 'true'
        run: python scripts/builder.py stage

      - name: Build community PortableApps-style installer with pinned shared builder
        if: steps.resolve.outputs.skip != 'true'
        id: package
        uses: vhick/Portable-Package-Builder@0112c35580e83b37eb8757ebcb949274e1631a04 # v1.0.0
        with:
          source-dir: work/stage/FreeCrawlSEOToolPortable
          output-dir: work/installer-out
          engine: custom-nsis
          running-exe: App\FreeCrawl\FreeCrawl SEO Tool.exe
          timeout-seconds: '900'
          package-revision: ${{ inputs.package_revision }}

      - name: Verify actual generated installer PE and collect its exact output name
        if: steps.resolve.outputs.skip != 'true'
        env:
          INSTALLER_FILE: ${{ steps.package.outputs.installer-file }}
        run: python scripts/builder.py validate-installer --path "$env:INSTALLER_FILE"

      - name: Dry-run publisher (must succeed before live release)
        if: steps.resolve.outputs.skip != 'true'
        uses: vhick/portable-release-publisher@cb64f86ac2d8c67506db5832de07f9ff58cbeaeb # v1.1.1
        with:
          files: |
            dist/*.zip
            dist/*.paf.exe
          tag: ${{ steps.resolve.outputs.release_tag }}
          release-title: FreeCrawl SEO Tool PortableApps ${{ steps.resolve.outputs.tag }} (${{ inputs.package_revision }})
          tag-prefix: portable-
          keep-releases: '3'
          prune: 'false'
          dry-run: 'true'

      - name: Publish validated packages in calling builder repository only
        if: steps.resolve.outputs.skip != 'true' && inputs.publish
        uses: vhick/portable-release-publisher@cb64f86ac2d8c67506db5832de07f9ff58cbeaeb # v1.1.1
        with:
          files: |
            dist/*.zip
            dist/*.paf.exe
          tag: ${{ steps.resolve.outputs.release_tag }}
          release-title: FreeCrawl SEO Tool PortableApps ${{ steps.resolve.outputs.tag }} (${{ inputs.package_revision }})
          tag-prefix: portable-
          keep-releases: '3'
          prune: 'false'
          dry-run: 'false'

      - name: Deliver packages as temporary workflow artifacts if publishing was disabled
        if: success() && steps.resolve.outputs.skip != 'true' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: freecrawl-validated-portableapps-packages
          path: |
            dist/*.zip
            dist/*.paf.exe
          retention-days: 7
          if-no-files-found: error

      - name: Preserve validated ZIP for recovery if installer or publisher fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: freecrawl-ZIP-recovery-if-generated
          path: dist/*.zip
          retention-days: 7
          if-no-files-found: ignore
